<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Ma Malek ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Caveat:wght@700&family=Poppins:wght@300;400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: radial-gradient(circle, #2b0004 0%, #0a0002 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Matrix Canvas */
        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.5;
            transition: opacity 0.8s ease;
        }

        /* Container & 3D Glassmorphism Steps */
        .container {
            width: 100%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 0, 60, 0.1);
            transform-style: preserve-3d;
            transform: translateZ(20px);
        }

        .step {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        .step.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) rotateX(-10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #ff003c, 0 0 30px #ff003c;
            font-weight: 700;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: #ffccd5;
            direction: rtl;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
        }

        /* 3D Glass Buttons */
        .btn {
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.8), rgba(255, 77, 109, 0.8));
            backdrop-filter: blur(5px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(255, 0, 60, 0.4), inset 0 2px 5px rgba(255,255,255,0.4);
            transition: all 0.3s ease;
            margin-top: 20px;
            font-family: 'Poppins', sans-serif;
            position: relative;
            z-index: 20;
            transform: translateZ(15px);
            cursor: pointer;
        }

        .btn:hover {
            transform: translateZ(25px) scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 0, 60, 0.7), inset 0 2px 8px rgba(255,255,255,0.6);
        }

        /* Heart Animation */
        .big-heart {
            font-size: 4rem;
            animation: pulse 1.2s infinite;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px #ff003c);
            transform: translateZ(30px);
        }

        @keyframes pulse {
            0% { transform: scale(1) translateZ(30px); }
            50% { transform: scale(1.15) translateZ(40px); }
            100% { transform: scale(1) translateZ(30px); }
        }

        /* Glowing Age Number */
        .glow-age {
            font-size: 6rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px #ff003c, 0 0 40px #ff003c, 0 0 60px #ff003c;
            margin-bottom: 10px;
            line-height: 1;
            transform: translateZ(35px);
        }

        /* 3D Glass Letter Box */
        .letter-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 60, 0.3);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 0, 60, 0.1);
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            line-height: 1.5;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            max-height: 250px;
            overflow-y: auto;
            transform: translateZ(10px);
        }

        .letter-box .arabic-word {
            font-family: 'Amiri', serif;
            font-weight: bold;
            font-size: 1.8rem;
            color: #ffccd5;
        }

        /* Attractive Cake with 3D depth */
        .cake-wrapper {
            margin-top: 60px;
            margin-bottom: 30px;
            position: relative;
            transform: translateZ(25px);
        }

        .cake {
            position: relative;
            width: 220px;
            height: 100px;
            background: linear-gradient(135deg, #ff4d6d, #ff003c);
            border-radius: 10px 10px 5px 5px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.6), inset 0 5px 10px rgba(255,255,255,0.3);
        }

        .cake::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px 10px 0 0;
        }

        .cake::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 10px;
            width: 20px;
            height: 25px;
            background: #fff;
            border-radius: 0 0 20px 20px;
            box-shadow: 30px 5px 0 #fff, 60px -5px 0 #fff, 90px 10px 0 #fff, 120px -2px 0 #fff, 150px 8px 0 #fff, 180px 2px 0 #fff;
        }

        .plate {
            position: absolute;
            bottom: -20px;
            left: -20px;
            width: 260px;
            height: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            z-index: -1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Number Candles */
        .candles-container {
            position: absolute;
            top: -75px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 5;
        }

        .candle-number {
            position: relative;
            font-size: 5rem;
            font-weight: 700;
            color: #ffe6ea;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 3px 3px 0px #ff003c;
            cursor: pointer;
            line-height: 1;
            transition: all 0.3s ease;
        }

        .candle-number.extinguished {
            color: #555;
            text-shadow: none;
        }

        .flame {
            width: 16px;
            height: 26px;
            background: #ffbe0b;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 0.1s infinite alternate;
            box-shadow: 0 0 15px #ffbe0b, 0 0 30px #ffbe0b;
        }

        .candle-number.extinguished .flame {
            display: none;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(0.9); opacity: 0.8; }
        }

        /* Fireworks Canvas */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vw;
            z-index: 1;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <div id="step-1" class="step active">
            <div class="big-heart">❤️</div>
            <h1 style="background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 15px; backdrop-filter: blur(5px);">Pour Toi</h1>
            <button class="btn" onclick="nextStep(2)">Clique ici 👇</button>
        </div>

        <div id="step-2" class="step">
            <h1 style="font-size: 3.2rem; line-height: 1.2;">Joyeux anniversaire<br>mon amour malek</h1>
            <button class="btn" onclick="nextStep(3)">Suivant ✨</button>
        </div>

        <div id="step-3" class="step">
            <div class="glow-age">25</div>
            <div class="arabic-text">وفي هذا اليوم ولد القمر 🌙</div>
            <div class="letter-box" id="typewriterBox"></div>
            <button class="btn" id="nextToCakeBtn" style="display: none;" onclick="nextStep(4)">La Suite 🎁</button>
        </div>

        <div id="step-4" class="step">
            <h1>C'est l'heure du gâteau !</h1>
            <p style="color: #ffccd5;">Clique sur les bougies pour les éteindre...</p>
            
            <div class="cake-wrapper">
                <div class="candles-container">
                    <div class="candle-number" onclick="extinguish(this)">
                        2
                        <div class="flame"></div>
                    </div>
                    <div class="candle-number" onclick="extinguish(this)">
                        5
                        <div class="flame"></div>
                    </div>
                </div>
                <div class="cake"></div>
                <div class="plate"></div>
            </div>
        </div>

        <div id="step-5" class="step">
            <div class="big-heart" style="color: #ffbe0b; filter: drop-shadow(0 0 20px #ffbe0b);">🌠</div>
            <h1 class="arabic-text" style="font-size: 3.5rem;">تمني امنية...</h1>
            <p style="font-size: 1.2rem; color: #ccc;">أغمضي عينيكِ وتمني ما تريدين</p>
            <button class="btn" onclick="makeWish()">تمنيت ! ❤️</button>
        </div>

        <div id="step-6" class="step">
            <h1 style="font-size: 4rem; z-index: 10;">Je T'aime Malek ! ❤️</h1>
            <p style="font-size: 1.5rem; z-index: 10; color: #ffccd5;">Joyeux 25ème Anniversaire 🎉</p>
        </div>
    </div>

    <script>
        // --- Matrix Animation Logic (MALEK Name in Pages 1 & 2) ---
        const matrixCanvas = document.getElementById('matrixCanvas');
        const mCtx = matrixCanvas.getContext('2d');
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;

        const letters = "MALEK❤️25";
        const alphabet = letters.split("");
        const fontSize = 18;
        const columns = matrixCanvas.width / fontSize;
        const rainDrops = [];
        for (let x = 0; x < columns; x++) { rainDrops[x] = 1; }

        function drawMatrix() {
            mCtx.fillStyle = 'rgba(10, 0, 2, 0.08)';
            mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            mCtx.fillStyle = '#ff003c'; 
            mCtx.font = 'bold ' + fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                mCtx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        let matrixInterval = setInterval(drawMatrix, 30);

        window.addEventListener('resize', () => {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
        });

        // --- Navigation Logic ---
        function nextStep(stepNum) {
            // Keep matrix alive for step 1 and 2, fade out afterwards
            if(stepNum > 2) {
                matrixCanvas.style.opacity = '0';
                setTimeout(() => {
                    clearInterval(matrixInterval);
                    matrixCanvas.style.display = 'none';
                }, 800);
            }

            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            document.getElementById(`step-${stepNum}`).classList.add('active');

            // Trigger typewriter when entering page 3
            if(stepNum === 3) {
                startTypewriter();
            }
        }

        // --- Typewriter Effect for Page 3 ---
        const messageText = "Joyeux anniversaire papaty ❤️ hbitk ndirlk haja special psq nti bnadem unique w special ❤️🫶🏼 lqmer yliqlo ghir lhaja chaba 🫶🏼 rbi ykhlik liya habibi kol 3am wnti liya whdi wta3i ana wahdi , nhbk bzfff ya محور الكون l3qoba l 100 ans inchallah , vrmn nhbk bzfff rabi y3tik ela hsab qlbk wy3tik kamel wch ttmnay 🫶🏼 ki lyom twli fi dari wna nkhdmlk la tarte wn3mrhaaaaaalk b chocolaaaaa 😍ya lbnina Jtm bcp martyy , bisous 💋";
        let charIndex = 0;
        let typewriterStarted = false;

        function startTypewriter() {
            if (typewriterStarted) return;
            typewriterStarted = true;
            const box = document.getElementById('typewriterBox');
            box.innerHTML = "";
            charIndex = 0;

            function type() {
                if (charIndex < messageText.length) {
                    let char = messageText.charAt(charIndex);
                    // Check if part of arabic phrase to wrap it for styling
                    if(messageText.substring(charIndex, charIndex + 11) === "محور الكون") {
                        box.innerHTML += `<span class="arabic-word">محور الكون</span>`;
                        charIndex += 11;
                    } else {
                        box.innerHTML += char;
                        charIndex++;
                    }
                    box.scrollTop = box.scrollHeight;
                    setTimeout(type, 35);
                } else {
                    document.getElementById('nextToCakeBtn').style.display = 'inline-block';
                }
            }
            type();
        }

        // --- Candle Logic ---
        let extinguishedCount = 0;
        function extinguish(candle) {
            if (!candle.classList.contains('extinguished')) {
                candle.classList.add('extinguished');
                extinguishedCount++;
                if (extinguishedCount === 2) {
                    setTimeout(() => {
                        nextStep(5);
                    }, 1200);
                }
            }
        }

        // --- Wish & Fireworks Logic ---
        function makeWish() {
            nextStep(6);
            startFireworks();
        }

        function startFireworks() {
            const canvas = document.getElementById('fireworksCanvas');
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#ff003c', '#ff4d6d', '#ffbe0b', '#ffffff', '#ff9000'];

            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.radius = Math.random() * 3 + 1;
                    this.velocity = {
                        x: (Math.random() - 0.5) * 12,
                        y: (Math.random() - 0.5) * 12
                    };
                    this.friction = 0.98;
                    this.gravity = 0.05;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.015 + 0.01;
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }

                update() {
                    this.velocity.x *= this.friction;
                    this.velocity.y *= this.friction;
                    this.velocity.y += this.gravity;
                    this.x += this.velocity.x;
                    this.y += this.velocity.y;
                    this.alpha -= this.decay;
                    this.draw();
                }
            }

            function explode(x, y) {
                for (let i = 0; i < 120; i++) {
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new Particle(x, y, color));
                }
            }

            function animate() {
                requestAnimationFrame(animate);
                ctx.fillStyle = 'rgba(10, 0, 2, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (Math.random() < 0.06) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height / 2);
                    explode(x, y);
                }

                particles.forEach((particle, index) => {
                    if (particle.alpha <= 0) {
                        particles.splice(index, 1);
                    } else {
                        particle.update();
                    }
                });
            }

            explode(canvas.width / 2, canvas.height / 3);
            animate();
            
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
    </script>
</body>
</html>
